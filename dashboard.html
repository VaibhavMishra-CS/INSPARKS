<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>INSPARKS — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
<link rel="stylesheet" href="./src/theme.css">
<link rel="stylesheet" href="./src/dashboard.css">
</head>
<body class="dashboard-body">

<div class="app-shell">

  <!-- SIDEBAR — content injected by icons.js -> mountSidebar('home') -->
  <aside class="sidebar"></aside>

  <!-- MAIN DASHBOARD CONTENT -->
  <main class="dashboard-main" id="main-content">

    <!-- HAYAILEARN-STYLE TOP METRICS & PROFILE BAR -->
    <header class="top-nav-bar panel">
      <div class="left-metrics">
        <div class="metric-chip level-chip">
          <span id="user-lvl-display">1 lvl</span>
        </div>
        <div class="metric-chip goal-chip">
          <span class="icon">📕</span>
          <span id="daily-card-count">0 / 15</span>
        </div>
        <div class="metric-chip energy-chip">
          <span class="icon">⚡</span>
          <span id="user-points">100</span>
        </div>
        <div class="metric-chip streak-chip">
          <span class="icon">🔥</span>
          <span id="user-streak">0 days</span>
        </div>
      </div>

      <div class="right-profile-controls">
        <!-- Theme Toggle Moved to Home Bar -->
        <button class="theme-toggle-btn" id="top-theme-toggle" title="Toggle Light/Dark Theme">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">Dark</span>
        </button>

        <!-- Profile Badge Moved to Home Bar -->
        <div class="top-user-profile">
          <div class="profile-avatar" id="profile-avatar-initial">U</div>
          <div class="profile-info">
            <span class="profile-name" id="user-display-name">User</span>
            <span class="profile-email" id="user-display-email">user@example.com</span>
          </div>
        </div>
      </div>
    </header>

    <!-- TITLE & CATEGORY FILTER ROW -->
    <section class="catalog-header-section">
      <div class="title-row">
        <h2>Videos</h2>
        <div class="header-actions">
          <button class="action-btn" id="refresh-btn" title="Refresh Feed">🔄</button>
          <button class="action-btn" id="filter-btn" title="Filter Options">🎛️</button>
        </div>
      </div>

      <!-- Scrollable Category Pills -->
      <div class="category-scroll-bar" id="categoryContainer">
        <button class="category-pill active" data-category="all">All</button>
        <button class="category-pill" data-category="anime">Anime/Manga</button>
        <button class="category-pill" data-category="gaming">Gaming</button>
        <button class="category-pill" data-category="music">Music</button>
        <button class="category-pill" data-category="vlog">Vlog</button>
        <button class="category-pill" data-category="street">Street Interview</button>
        <button class="category-pill" data-category="education">Education</button>
        <button class="category-pill" data-category="podcast">Podcast</button>
      </div>
    </section>

    <!-- VIDEO CATALOG GRID -->
    <section class="video-catalog-section">
      <div class="video-grid" id="videoGrid">
        <!-- Dynamic video cards populated by dashboard.js -->
      </div>
    </section>

  </main>

</div>

<script type="module" src="./src/dashboard.js"></script>
</body>
</html>
