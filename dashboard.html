<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>INSPARKS — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
<link rel="stylesheet" href="./src/theme.css">
<link rel="stylesheet" href="./src/dashboard.css">
</head>
<body class="dashboard-body">

<div class="app-shell">

  <!-- SIDEBAR — content injected by icons.js -> mountSidebar('home') -->
  <aside class="sidebar"></aside>

  <!-- MAIN -->
  <main class="dashboard-main" id="main-content">

    <div class="top-row">
      <div class="stat-card panel">
        <div class="stat-card-head">
          <h3>Daily Goal</h3>
        </div>
        <div class="stat-card-body">
          <div class="progress-ring">
            <svg viewBox="0 0 100 100">
              <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
              <circle class="ring-fg" id="daily-goal-ring" cx="50" cy="50" r="42"></circle>
            </svg>
            <div class="ring-label">
              <span class="ring-num" id="daily-goal-num">0</span>
              <span class="ring-total">/15</span>
            </div>
          </div>
          <div class="stat-card-desc">Cards reviewed today</div>
        </div>
      </div>

      <div class="stat-card panel">
        <div class="stat-card-head">
          <h3>Mistakes</h3>
        </div>
        <div class="stat-card-body row">
          <div class="mistake-num" id="mistake-num">0<span>/10</span></div>
          <div class="stat-card-desc">Missed this week</div>
        </div>
      </div>
    </div>

    <!-- GAME LAUNCHER -->
    <section class="game-launcher panel">
      <div class="shoji-bg" aria-hidden="true"></div>

      <div class="launcher-content">
        <button class="launcher-node" id="previous-games-btn">
          <span class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
          </span>
          <span class="node-kanji">続き</span>
          <span class="node-label">Previous Games</span>
        </button>

        <button class="launcher-hub" id="play-btn">
          <span class="hub-ring ring-1"></span>
          <span class="hub-ring ring-2"></span>
          <span class="hub-label">PLAY</span>
        </button>

        <button class="launcher-node" id="achievements-btn">
          <span class="node-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9c0-1 1-2 2-2h8c1 0 2 1 2 2v8c0 1-1 2-2 2H8c-1 0-2-1-2-2z"/><path d="M9 5l-3 3M15 5l3 3"/></svg>
          </span>
          <span class="node-kanji">実績</span>
          <span class="node-label">Achievements</span>
        </button>
      </div>
    </section>

    <div id="levelSelectModal" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <h2>Choose your level</h2>
        <div class="level-pick-grid">
          <button class="level-pick-card" onclick="loadGame('N5')"><span class="badge n5">N5</span><h4>Beginner</h4></button>
          <button class="level-pick-card" onclick="loadGame('N4')"><span class="badge n4">N4</span><h4>Elementary</h4></button>
          <button class="level-pick-card" onclick="loadGame('N3')"><span class="badge n3">N3</span><h4>Intermediate</h4></button>
          <button class="level-pick-card" onclick="loadGame('N2')"><span class="badge n2">N2</span><h4>Upper-int.</h4></button>
          <button class="level-pick-card" onclick="loadGame('N1')"><span class="badge n1">N1</span><h4>Advanced</h4></button>
        </div>
      </div>
    </div>

    <div id="gameUI" class="panel" style="display:none; padding:40px; text-align:center;">
      <h2>Level: <span id="selectedLevel" style="color:var(--accent);">N5</span></h2>
      <p style="color:var(--text-secondary); margin-bottom:24px;">Practice cards render here</p>
      <button class="btn btn-ghost" onclick="goBackToDashboard()">← Back to Dashboard</button>
    </div>

  </main>

  <!-- RIGHT RAIL — mascot stays ONLY on home -->
  <aside class="right-rail">
    <div class="mascot-card panel">
      <div class="mascot-head">
        <h4>[MASCOT NAME]</h4>
        <span class="lvl-badge">Lvl 0</span>
      </div>
      <div class="mascot-progress">0 / 25 correct</div>
      <div class="mascot-art"></div>
    </div>

    <div class="quick-practice-card panel">
      <h3>Quick Practice</h3>
      <p>5 random cards from your weakest deck.</p>
      <button class="btn btn-primary" id="quick-practice-btn" style="width:100%;">Start</button>
    </div>
  </aside>

</div>

<script type="module" src="./src/dashboard.js"></script>
</body>
</html>
