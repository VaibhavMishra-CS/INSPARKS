<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSPARKS — Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/modules.css">
</head>
<body class="dashboard-body">

<div class="app-shell">
  <aside class="sidebar"></aside>

  <main class="dashboard-main">
    <div class="modules-header">
      <h1>Books</h1>
    </div>

    <div class="module-grid" id="module-grid">
      <!-- module cards injected by modules.js -->
    </div>
  </main>

  <aside class="right-rail">
    <div class="panel" style="padding:20px;">
      <h3 style="margin:0 0 8px; font-size:15px;">Your Progress</h3>
      <p style="margin:0; font-size:13.5px; color:var(--text-secondary);">Complete each book's practice set to build up accuracy and completion stats.</p>
    </div>
  </aside>
</div>

<!-- READ MODAL -->
<div id="readModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="readModalTitle">Read</h2>
      <button class="modal-close" onclick="closeModal('readModal')">×</button>
    </div>
    <div class="modal-body" id="readModalBody"></div>
  </div>
</div>

<!-- PRACTICE MODAL -->
<div id="practiceModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="practiceModalTitle">Practice</h2>
      <button class="modal-close" onclick="closePracticeModal()">×</button>
    </div>
    <div class="modal-body" id="mcqContainer"></div>
  </div>
</div>

<script type="module" src="src/modules.js"></script>
</body>
</html>
